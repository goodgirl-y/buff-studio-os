function openG(){const o=openW('w','GAME 퇴근 로딩.exe','');if(o.t)return;o.t='g';gIntro(o)}
function gIntro(o){setB(o,`<p class=sys>MINI GAME</p><p class=name>퇴근 로딩 GAME</p><p>60초 안에 퇴근 게이지를 100%로 채우면 성공이에요.</p><div class=st><b>1</b>버튼을 꾹 누르고 있으면 퇴근 게이지가 차올라요.</div><div class=st><b>2</b>팀장님 접근 중! 경고가 뜨면 바로 손을 떼세요.</div><div class=st><b>3</b>팀장님이 있을 때 누르고 있으면 들켜서 25% 줄어요.</div><div class=row><button class=o data-a=gs>게임 시작</button></div>`)}
function gStart(o){clearInterval(o.iv);Object.assign(o,{p:0,tl:60,hold:0,ph:'ok',pt:3000,hit:0,k:'',run:1});setT(o,'GAME 퇴근 로딩.exe');
 setB(o,`<div class=gm><span>퇴근 로딩 <b class=gp>0%</b></span><span>남은 시간 <b class=gtm>60</b>초</span></div><div class=bar><i class=gb style=width:0></i></div><div class=gs></div><button class=hb>누르고 있으면 퇴근 준비 중</button>`);
 const hb=o.el.querySelector('.hb'),on=v=>()=>{o.hold=v;hb.classList.toggle('on',!!v)};
 hb.onpointerdown=on(1);hb.onpointerup=hb.onpointercancel=hb.onpointerleave=on(0);hb.oncontextmenu=e=>e.preventDefault();
 o.iv=setInterval(()=>gTick(o),100);gUI(o)}
function gTick(o){o.tl-=.1;o.pt-=100;
 if(o.pt<=0){if(o.ph=='ok'){o.ph='warn';o.pt=1500}else if(o.ph=='warn'){o.ph='boss';o.pt=1400;o.hit=0}else{o.ph='ok';o.pt=rnd()}}
 if(o.ph=='boss'&&o.hold&&!o.hit){o.hit=1;o.p=Math.max(0,o.p-25)}else if(o.hold&&o.ph!='boss')o.p=Math.min(100,o.p+100/250);
 if(o.p>=100)return gEnd(o,1);if(o.tl<=0)return gEnd(o,0);gUI(o)}
function gUI(o){const q=s=>o.el.querySelector(s);q('.gp').textContent=Math.floor(o.p)+'%';q('.gb').style.width=o.p+'%';q('.gtm').textContent=Math.ceil(o.tl);
 const k=o.ph+o.hold+o.hit;if(k==o.k)return;o.k=k;const g=q('.gs');g.className='gs '+(o.ph=='ok'?'':o.ph);
 g.innerHTML=o.ph=='warn'?'팀장님 접근 중!<br>손을 떼세요':o.ph=='boss'?(o.hit?'들켰다! -25%<br>손을 떼세요':'업무 중인 척!<br>누르면 안 돼요'):`<i class="lg ${o.hold?'spin':''}" style=width:72px></i>${o.hold?'퇴근 준비 중…':'버튼을 눌러 시작'}`}
function gEnd(o,w){clearInterval(o.iv);o.run=0;const B='<div class=row><button class=o data-a=ok>확인</button><button class=o data-a=again>다시 하기</button></div>';setT(o,'game_result.exe');
 setB(o,w?`<p class=sys>[시스템 알림] 퇴근 로딩 100%</p><p class=name>퇴근 성공!</p><p>눈치 싸움에서 이겼어요. 오늘 하루도 수고 많았어요!</p><div class="box cheer"><b>보너스 buff</b>${BON[Math.random()*4|0]}</div>${B}`:`<p class=sys>[시스템 알림] 퇴근 로딩 중단</p><p class=name>야근 확정…</p><p>괜찮아요, 여기까지도 충분히 잘했어요. 다시 도전해 볼까요?</p><div class="box cheer"><b>오늘의 응원</b>내일은 꼭 칼퇴할 수 있을 거예요!</div>${B}`)}
boot();bump();
</script></body></html>
